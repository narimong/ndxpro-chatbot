version: '3.8'

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: agent-chatbot-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-ndxpro123!}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-chatbot-api
    ports:
      - "58080:58080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-ndxpro123!}
      - GRAPH_RAG_ENABLED=${GRAPH_RAG_ENABLED:-true}
      - USE_AGENT_MODE=${USE_AGENT_MODE:-true}
      - PORT=58080
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
